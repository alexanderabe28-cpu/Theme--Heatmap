name: Daily Breadth

on:
  schedule:
    # Mo-Fr 22:30 UTC = nach US-Boersenschluss (Sommer- und Winterzeit)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Historie neu aufbauen (Jahre, 0 = normaler Tageslauf)"
        default: "0"
      refresh_universe:
        description: "Universen sofort neu laden (sonst woechentlich)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-breadth
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Abhaengigkeiten
        run: pip install -r requirements-pipeline.txt

      - name: Daten sammeln
        run: |
          python -u -m scanner.run_daily \
            --backfill-years "${{ inputs.backfill_years || 0 }}" \
            ${{ inputs.refresh_universe && '--refresh-universe' || '' }}

      - name: Daten ins Repo schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "data: breadth $(date -u +%F)"
          git pull --rebase --autostash
          git push
